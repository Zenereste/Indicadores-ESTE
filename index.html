<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- portada v2 -->
<meta name="robots" content="noindex, nofollow">
<title>Cuadros de mando · Zener</title>
<style>
  :root { --fg: #1d1d1b; --mu: #6b6a66; --bg: #f5f4f0; --panel: #ffffff; --line: #e3e1dc; --navy: #24264f; --bad: #c0392b; --ok: #2e7d32; --warn: #b26a00; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .barra { display: flex; align-items: center; gap: 12px; padding: 10px 18px; background: var(--navy); color: #fff; min-height: 56px; }
  .barra img { height: 34px; border-radius: 6px; }
  .barra h1 { font-size: 17px; font-weight: 600; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .barra button { font: inherit; font-size: 14px; color: #fff; background: transparent; border: 1px solid rgba(255,255,255,.4); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  .barra button:hover { background: rgba(255,255,255,.12); }
  .login { max-width: 380px; margin: 12vh auto 0; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 28px; box-shadow: 0 6px 24px rgba(0,0,0,.06); }
  .login img { display: block; height: 52px; margin: 0 auto 18px; border-radius: 8px; }
  .login h2 { margin: 0 0 6px; font-size: 20px; text-align: center; }
  .login p { margin: 0 0 18px; color: var(--mu); font-size: 14px; text-align: center; }
  .login input[type=password] { width: 100%; font: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; }
  .login label { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--mu); margin: 12px 0 16px; }
  .login button { width: 100%; font: inherit; font-size: 16px; font-weight: 600; color: #fff; background: var(--navy); border: 0; border-radius: 8px; padding: 11px; cursor: pointer; }
  .login button:disabled { opacity: .6; }
  .error { color: var(--bad); font-size: 14px; margin-top: 12px; text-align: center; min-height: 1.2em; }
  .menu { max-width: 1100px; margin: 0 auto; padding: 28px 18px 40px; }
  .cabecera { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 6px 16px; margin-bottom: 20px; }
  .cabecera h2 { margin: 0; font-size: 24px; }
  .cabecera .saludo { margin: 0 0 2px; color: var(--mu); font-size: 14px; }
  .actualizado { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--mu); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; }
  .tarjetas { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 18px; }
  .tarjeta { --c: var(--navy); position: relative; text-align: left; font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px 16px; cursor: pointer; display: flex; flex-direction: column; gap: 12px; overflow: hidden; transition: transform .12s, box-shadow .12s, border-color .12s; }
  .tarjeta::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 5px; background: var(--c); }
  .tarjeta:hover, .tarjeta:focus-visible { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(0,0,0,.09); border-color: color-mix(in srgb, var(--c) 45%, var(--line)); outline: none; }
  .t-cab { display: flex; align-items: center; gap: 12px; }
  .icono { flex: none; width: 42px; height: 42px; border-radius: 11px; display: grid; place-items: center; font-size: 21px; background: color-mix(in srgb, var(--c) 13%, #fff); }
  .t-cab b { font-size: 16.5px; line-height: 1.25; }
  .t-desc { color: var(--mu); font-size: 13.5px; line-height: 1.4; }
  .t-pie { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--mu); }
  .estado { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
  .estado::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--mu); }
  .estado.ok { color: var(--ok); } .estado.ok::before { background: var(--ok); }
  .estado.aviso { color: var(--warn); } .estado.aviso::before { background: var(--warn); }
  .abrir { color: var(--c); font-weight: 600; white-space: nowrap; }
  @media (max-width: 520px) { .cabecera h2 { font-size: 21px; } }
  .visor { position: fixed; inset: 56px 0 0 0; }
  .visor iframe { width: 100%; height: 100%; border: 0; background: #fff; }
  .cargando { padding: 40px; text-align: center; color: var(--mu); }
  [hidden] { display: none !important; }
</style>

JIHdxZKxHoAoF/AL7Brq39gTsfAAAAAElFTkSuQmCC" alt="Zener">
  <h2>Cuadros de mando</h2>
  <p>Escribe la contraseña para entrar.</p>
  <input type="text" name="username" value="zener" autocomplete="username" hidden>
  <input type="password" id="clave" autocomplete="current-password" placeholder="Contraseña" required>
  <label><input type="checkbox" id="recordar" checked> Recordarme en este dispositivo</label>
  <button type="submit" id="entrar">Entrar</button>
  <div class="error" id="error"></div>
</form>

<div class="menu" id="menu" hidden>
  <div class="cabecera">
    <div><p class="saludo" id="saludo"></p><h2>Elige un cuadro</h2></div>
    <span class="actualizado" id="generado"></span>
  </div>
  <div class="tarjetas" id="tarjetas"></div>
</div>

<div class="visor" id="visor" hidden>
  <div class="cargando" id="cargando">Cargando…</div>
  <iframe id="marco" title="Cuadro de mando" hidden></iframe>
</div>

<script>
(() => {
  const SALT = Uint8Array.from(atob('YSZCAA8sVSvY4oz26l4IMg=='), (c) => c.charCodeAt(0));
  const ITER = 310000;
  const GUARDADA = 'zener-cuadros-clave';
  const $ = (id) => document.getElementById(id);
  let llave = null, manifiesto = null;

  const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
  async function derivar(pw) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: SALT, iterations: ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  }
  async function abrir(nombre) {
    const r = await fetch(nombre + '?v=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('descarga');
    const buf = new Uint8Array(await r.arrayBuffer());
    const plano = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, llave, buf.slice(12));
    const flujo = new Blob([plano]).stream().pipeThrough(new DecompressionStream('gzip'));
    return JSON.parse(await new Response(flujo).text());
  }
  async function guardar(recordar) {
    const raw = b64(await crypto.subtle.exportKey('raw', llave));
    sessionStorage.setItem(GUARDADA, raw);
    if (recordar) localStorage.setItem(GUARDADA, raw); else localStorage.removeItem(GUARDADA);
  }
  async function recuperar() {
    const raw = sessionStorage.getItem(GUARDADA) || localStorage.getItem(GUARDADA);
    if (!raw) return false;
    try {
      llave = await crypto.subtle.importKey('raw', Uint8Array.from(atob(raw), (c) => c.charCodeAt(0)), 'AES-GCM', true, ['decrypt']);
      manifiesto = await abrir('manifiesto.bin');
      return true;
    } catch (e) { llave = null; localStorage.removeItem(GUARDADA); sessionStorage.removeItem(GUARDADA); return false; }
  }
  function verLogin() {
    $('login').hidden = false; $('menu').hidden = true; $('visor').hidden = true;
    $('volver').hidden = true; $('salir').hidden = true; $('titulo').textContent = 'Cuadros de mando';
    setTimeout(() => $('clave').focus(), 50);
  }
  function verMenu() {
    $('login').hidden = true; $('menu').hidden = false; $('visor').hidden = true;
    $('volver').hidden = true; $('salir').hidden = false; $('titulo').textContent = 'Cuadros de mando';
    $('marco').srcdoc = ''; $('marco').hidden = true;
    const h0 = new Date().getHours();
    const fecha = new Date().toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
    $('saludo').textContent = (h0 < 14 ? 'Buenos días' : h0 < 21 ? 'Buenas tardes' : 'Buenas noches') + ' · ' + fecha;
    $('generado').textContent = '🔄 Actualizado el ' + manifiesto.generado;
    const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
    $('tarjetas').replaceChildren(...manifiesto.cuadros.map((c) => {
      const b = el('button', 'tarjeta');
      b.type = 'button';
      if (c.color) b.style.setProperty('--c', c.color);
      const cab = el('div', 't-cab');
      cab.append(el('span', 'icono', c.icono || '📈'), el('b', null, c.titulo));
      b.append(cab, el('span', 't-desc', c.descripcion));
      const pie = el('div', 't-pie');
      const est = el('span', null);
      if (c.estado && c.estado.texto) { est.append(el('span', 'estado ' + c.estado.tipo, c.estado.texto)); }
      est.append(document.createTextNode((c.estado && c.estado.texto ? ' · ' : '') + 'Datos hasta ' + (c.datos_hasta || '—')));
      pie.append(est, el('span', 'abrir', 'Abrir →'));
      b.append(pie);
      b.addEventListener('click', () => { location.hash = c.id; });
      return b;
    }));
  }
  async function verCuadro(id) {
    const c = manifiesto.cuadros.find((x) => x.id === id);
    if (!c) { verMenu(); return; }
    $('login').hidden = true; $('menu').hidden = true; $('visor').hidden = false;
    $('volver').hidden = false; $('salir').hidden = false; $('titulo').textContent = c.titulo;
    $('cargando').hidden = false; $('cargando').textContent = 'Cargando…'; $('marco').hidden = true;
    try {
      const p = await abrir(c.archivo);
      $('marco').srcdoc = p.html;
      $('marco').onload = () => { $('cargando').hidden = true; $('marco').hidden = false; };
    } catch (e) { $('cargando').textContent = 'No se pudo abrir el cuadro. Vuelve a intentarlo en un momento.'; }
  }
  function ruta() {
    if (!llave) { verLogin(); return; }
    const id = location.hash.slice(1);
    if (id) verCuadro(id); else verMenu();
  }

  $('login').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    $('entrar').disabled = true; $('error').textContent = '';
    try {
      llave = await derivar($('clave').value);
      manifiesto = await abrir('manifiesto.bin');
      await guardar($('recordar').checked);
      $('clave').value = '';
      ruta();
    } catch (e) {
      llave = null;
      $('error').textContent = e.message === 'descarga' ? 'No se pudo conectar. Revisa la conexión.' : 'Contraseña incorrecta.';
    } finally { $('entrar').disabled = false; }
  });
  $('volver').addEventListener('click', () => { location.hash = ''; });
  $('salir').addEventListener('click', () => {
    localStorage.removeItem(GUARDADA); sessionStorage.removeItem(GUARDADA);
    llave = null; manifiesto = null; location.hash = ''; verLogin();
  });
  window.addEventListener('hashchange', ruta);
  recuperar().then(ruta);
})();
</script>
</body>
</html>
